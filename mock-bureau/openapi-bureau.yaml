openapi: 3.0.3
info:
  title: CSP451 Mock Credit Bureau
  version: 1.0.0
  description: >
    Course-owned mock credit bureau for CSP451 2026F. It stands in for Equifax
    and TransUnion in the Allymon Loan Risk Engine proof of concept. Every value
    it returns is synthetic and derived from a SHA-256 hash of the applicant
    identifier, so the same identifier always returns the same payload on every
    machine. There is no real bureau behind this service, no real applicant, and
    no real credit score. It makes no lending decision.
  contact:
    name: CSP451 course team
  license:
    name: Course use only
servers:
  - url: http://bureau.loanrisk.internal:8080
    description: Private address of the bureau virtual machine inside the team VNet
  - url: http://localhost:8080
    description: Local development
tags:
  - name: bureau
    description: Synthetic credit-bureau lookups
  - name: operations
    description: Health probe
paths:
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: The service is running
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /bureau/v1/applicants/{applicantId}:
    get:
      tags: [bureau]
      operationId: getBureauReport
      summary: Retrieve the synthetic bureau report for one applicant identifier
      parameters:
        - $ref: '#/components/parameters/ApplicantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/BureauReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /bureau/{applicantId}:
    get:
      tags: [bureau]
      operationId: getBureauReportShort
      summary: Convenience alias for the versioned path
      description: >
        Identical behaviour to /bureau/v1/applicants/{applicantId}. The versioned
        path is the one to use in code, because it is the path deployed on the
        bureau virtual machine in Week 3.
      parameters:
        - $ref: '#/components/parameters/ApplicantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/BureauReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /bureau/query:
    post:
      tags: [bureau]
      operationId: queryBureau
      summary: Retrieve a synthetic bureau report against a recorded consent reference
      description: >
        Models the real-world requirement that a bureau pull is permitted only
        against a recorded consent. The consent reference is a synthetic string
        generated by your own application; it is echoed back so the audit record
        can join the pull to the consent.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BureauQuery'
            examples:
              standard:
                summary: A consented pull for a synthetic applicant
                value:
                  applicantId: APP-0001
                  consentReference: CONSENT-2026F-0001
      responses:
        '200':
          description: Synthetic bureau report, with the consent reference echoed
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BureauReport'
                  - type: object
                    properties:
                      consentReference:
                        type: string
                        example: CONSENT-2026F-0001
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    ApplicantId:
      name: applicantId
      in: path
      required: true
      description: Synthetic applicant identifier, for example APP-0001
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,32}$'
        example: APP-0001
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: Correlation identifier. Echoed if supplied, generated if not.
      schema:
        type: string
        maxLength: 64
  headers:
    CorrelationId:
      description: Correlation identifier for this request
      schema:
        type: string
  responses:
    BureauReport:
      description: Synthetic bureau report
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BureauReport'
    BadRequest:
      description: The request was malformed
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown route
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, dataVersion, syntheticData]
      properties:
        status:
          type: string
          enum: [ok]
        dataVersion:
          type: string
          example: 2026F.1
        syntheticData:
          type: boolean
          enum: [true]
    BureauQuery:
      type: object
      required: [applicantId, consentReference]
      properties:
        applicantId:
          type: string
          pattern: '^[A-Za-z0-9-]{1,32}$'
        consentReference:
          type: string
          minLength: 1
          maxLength: 64
          description: Synthetic consent reference recorded by the calling system
    BureauReport:
      type: object
      required:
        - applicantId
        - bureau
        - dataVersion
        - retrievedAt
        - creditScore
        - riskBand
        - openTradelines
        - delinquencies24m
        - inquiries6m
        - monthlyDebtPayments
        - utilizationPct
        - fileAgeMonths
        - thinFile
        - syntheticData
      properties:
        applicantId:
          type: string
          example: APP-0001
        bureau:
          type: string
          enum: [EQUIFAX_MOCK, TRANSUNION_MOCK]
        dataVersion:
          type: string
          example: 2026F.1
        retrievedAt:
          type: string
          format: date-time
        creditScore:
          type: integer
          minimum: 480
          maximum: 850
        riskBand:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        openTradelines:
          type: integer
          minimum: 0
          maximum: 9
        delinquencies24m:
          type: integer
          minimum: 0
          maximum: 4
        inquiries6m:
          type: integer
          minimum: 0
          maximum: 6
        monthlyDebtPayments:
          type: integer
          minimum: 0
          maximum: 2000
          description: Synthetic monthly debt service in CAD
        utilizationPct:
          type: integer
          minimum: 0
          maximum: 99
        fileAgeMonths:
          type: integer
          minimum: 3
          maximum: 180
        thinFile:
          type: boolean
          description: True when fileAgeMonths is under 12 or openTradelines is under 2
        syntheticData:
          type: boolean
          enum: [true]
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: INVALID_APPLICANT_ID
        message:
          type: string
        correlationId:
          type: string
